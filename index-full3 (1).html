    <div class="thumb ld">${p.img ? `<img src="${p.img}" alt="${p.title}" loading="lazy" decoding="async">` : ''}</div>

    <p>${p.desc}</p>${(p.copy || []).length ? `<div class="copy-list">${p.copy.map(([k, v]) => `<button type="button" class="copy" data-v="${v}" aria-label="Copy ${k}"><span class="c-label">${k}</span><span class="c-val">${v}</span><span class="c-act">Copy</span></button>`).join('')}</div>` : ''}
  </article>`).join('');

// Ánh kính trượt qua ảnh khi lướt: ảnh càng gần giữa màn hình, ánh sáng càng nằm giữa ảnh
let frame = 0;
function updateShine() {
  const mid = innerHeight / 2;
  document.querySelectorAll('.item, .bar').forEach(el => {
    const r = el.getBoundingClientRect();
    const d = (r.top + r.height / 2 - mid) / innerHeight;
    el.style.setProperty('--shine', Math.max(-1, Math.min(1, d)).toFixed(3));
  });
}
addEventListener('scroll', () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(updateShine); }, { passive: true });
addEventListener('resize', updateShine);
updateShine();

function copyText(t) {
  const a = document.createElement('textarea');
  a.value = t; a.readOnly = true;
  a.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(a);
  a.select(); a.setSelectionRange(0, t.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  a.remove();
  if (ok) return Promise.resolve(true);
  return navigator.clipboard ? navigator.clipboard.writeText(t).then(() => true, () => false) : Promise.resolve(false);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('.copy');
  if (!b) return;
  const ok = await copyText(b.dataset.v), act = b.querySelector('.c-act');
  act.textContent = ok ? 'Đã copy ✓' : 'Chưa copy được';
  b.classList.toggle('done', ok);
  clearTimeout(b._t);
  b._t = setTimeout(() => { act.textContent = 'Copy'; b.classList.remove('done'); }, 1600);
});

function fb(th, title) {
  th.classList.remove('ld');
  th.innerHTML = `<div class="fb"><b>${title}</b><small>VanDuyIOS</small></div>`;
}
document.querySelectorAll('.item').forEach((it, i) => {
  const th = it.querySelector('.thumb'), im = th.querySelector('img'), title = CONFIG.projects[i].title;
  if (!im) return fb(th, title);
  const ok = () => { im.classList.add('ok'); th.classList.remove('ld'); }, bad = () => fb(th, title);
  im.addEventListener('load', ok);
  im.addEventListener('error', bad);
  if (im.complete) (im.naturalWidth ? ok : bad)();
  it.addEventListener('pointermove', e => {
    const r = it.getBoundingClientRect();
    it.style.setProperty('--mx', e.clientX - r.left + 'px');
    it.style.setProperty('--my', e.clientY - r.top + 'px');
  });
});

document.body.insertAdjacentHTML('beforeend', `<div class="tg-bar"><a class="tg-btn" href="${CONFIG.social.telegram}" target="_blank" rel="noopener noreferrer">${svg(IC.telegram)}Vào nhóm Telegram</a></div>`);
const ti = document.createElement('link');
ti.rel = 'apple-touch-icon';
ti.href = CONFIG.avatar;
document.head.appendChild(ti);

if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    e.target.style.setProperty('--d', Math.min(es.indexOf(e), 4) * 90 + 'ms');
    e.target.classList.add('in');
    setTimeout(() => e.target.classList.remove('rv', 'in'), 1600);
  }), { threshold: .1, rootMargin: '0px 0px -10% 0px' });
  document.querySelectorAll('.profile, .social, .item, .tools h2, .bar').forEach((el, i) => {
    el.classList.add('rv');
    el.style.setProperty('--d', (i % 4) * 80 + 'ms');
    io.observe(el);
  });
}

// ---- v4: thanh thông báo chạy chữ, tìm kiếm game ----
if ((CONFIG.notices || []).length) {
  document.body.insertAdjacentHTML('afterbegin', `<div class="ticker"><span class="tk-badge"><i></i>Thông báo</span><div class="tk-view"><div class="tk-track" id="tkTrack"></div></div></div>`);
  let tkW = 0;
  const buildTicker = () => {
    if (tkW === innerWidth) return;
    tkW = innerWidth;
    const tr = document.getElementById('tkTrack'), one = CONFIG.notices.map(n => `<span>${n}</span>`).join('');
    tr.innerHTML = one;
    const w = tr.scrollWidth || 1, n = matchMedia('(prefers-reduced-motion:reduce)').matches ? 1 : Math.ceil(innerWidth / w) + 1;
    tr.innerHTML = one.repeat(n);
    tr.style.setProperty('--w', w + 'px');
    tr.style.setProperty('--d', Math.max(12, w / 50) + 's');
  };
  buildTicker();
  if (document.fonts) document.fonts.ready.then(() => { tkW = 0; buildTicker(); });
  addEventListener('resize', buildTicker);
}

const fold = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0111/g, 'd');
const gm = document.getElementById('games');
gm.insertAdjacentHTML('beforebegin', `<div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Tìm game…" autocomplete="off" enterkeyhint="search" aria-label="Tìm game"><button type="button" class="q-x" aria-label="Xóa" hidden>×</button></div>`);
gm.insertAdjacentHTML('afterend', '<p class="empty" id="empty" hidden></p>');
const q = document.getElementById('q'), qx = document.querySelector('.q-x'), em = document.getElementById('empty');
const cards = [...gm.querySelectorAll('.item')];
const idx = CONFIG.projects.map(p => fold([p.title, p.desc, ...(p.tags || [])].join(' ')));
function filt() {
  const raw = q.value.trim(), v = fold(raw);
  let n = 0;
  cards.forEach((c, i) => { const ok = !v || idx[i].includes(v); c.hidden = !ok; n += ok; });
  qx.hidden = !q.value;
  em.hidden = n > 0;
  em.textContent = n ? '' : `Không tìm thấy game nào khớp “${raw}”.`;
}
q.addEventListener('input', filt);
q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur(); });
qx.addEventListener('click', () => { q.value = ''; filt(); q.focus(); });
</script>
